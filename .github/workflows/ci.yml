name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: homebrew-tap

      - name: brew style
        run: brew style --formula homebrew-tap/Formula/curlix.rb

      - name: brew audit
        run: brew audit --strict --formula homebrew-tap/Formula/curlix.rb
